name: Build Bliss Kernel + SukiSU Ultra + KPM

# 编译 Bliss OS 内核，移除内核自带 KernelSU，接入 SukiSU Ultra，开启 KPM，可选 SUSFS。
#
# ⚠️ 已知风险（写在最前面，别跳过）：
#   1. SukiSU Ultra 官方声明 X86_64 仅 "some" 支持 —— x86_64 不是它的主战场，arm64 才是。
#   2. Bliss 的 kernel_common 是 **非 GKI** 内核。SUSFS 补丁主要面向 GKI(android12-5.10/13-5.15/14-6.1)，
#      对非 GKI x86 内核极可能打不上或需手工修 patch。故 SUSFS 默认关闭，开启属自选风险。
#   3. GitHub 托管 runner 磁盘约 14GB，内核编译连产物通常 10–20GB。
#      本 workflow 已禁用 DEBUG_INFO 大幅瘦身；若仍爆盘，请改用 self-hosted runner。
#
# 产物：bzImage 内核 + 内核模块 tarball，发布到 Releases / Actions Artifacts。

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'kernel_common 分支（16.9.7 对应 gloria-20240908 / 6.1.96）'
        required: true
        default: 'gloria-20240908'
      defconfig:
        description: 'defconfig'
        required: true
        default: 'android-x86_64_defconfig'
      sukisu_ref:
        description: 'SukiSU-Ultra 分支或 tag'
        required: true
        default: 'main'
      extra_cmdline:
        description: '写入内核的内置启动参数（Bliss OS 需 nomodeset 才能开机）。留空则不写'
        required: false
        default: 'nomodeset'
      enable_kpm:
        description: '开启 KPM（Kernel Patch Module）'
        type: boolean
        default: true
      enable_susfs:
        description: '【高风险】尝试合入 SUSFS 补丁，非 GKI 内核大概率失败'
        type: boolean
        default: false
      susfs_repo:
        description: 'SUSFS 补丁仓库'
        required: false
        default: 'https://github.com/sidex15/susfs4ksu'
      publish_release:
        description: '发布到 Releases'
        type: boolean
        default: false
      tag_name:
        description: 'Release 标签'
        required: false
        default: 'kernel-sukisu-autobuild'

permissions:
  contents: write

jobs:
  build:
    # 内核编译比整棵 AOSP 轻得多，托管 runner 值得一试；爆盘则改 self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      SUKISU_DIR: ${{ github.workspace }}/SukiSU-Ultra

    steps:
      - name: 磁盘与资源自检
        run: |
          df -h "$GITHUB_WORKSPACE"
          AVAIL=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          echo "可用空间 ${AVAIL}GB；CPU $(nproc) 核"
          if [ "${AVAIL:-0}" -lt 12 ]; then
            echo "::error::可用空间 ${AVAIL}GB 过少，内核编译大概率失败。请改用 self-hosted runner。"
            exit 1
          fi

      - name: 安装内核编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git build-essential libssl-dev libelf-dev bc flex bison ccache \
            kmod dwarves zstd xz-utils rsync cpio python3 perl
          gcc --version | head -1

      - name: 拉取内核源码（浅克隆）
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/android-generic/kernel_common.git "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          # 打印版本，确认拉对了分支
          make kernelversion

      - name: 移除内核自带 KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "=== 自带 KSU 痕迹（只观察，不改动）==="
          ls -d drivers/kernelsu fs/kernelsu KernelSU 2>/dev/null || echo "(无 KSU 目录)"
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile 2>/dev/null | head || echo "(drivers 顶层无引用)"

          # 只删除指向 kernelsu 目录/文件的引用行。
          # 不要用 `sed '/kernelsu/I d'` 这类模糊删除：会误删 depends on / 注释等行，
          # 破坏 Kconfig 语法，导致下一步 make defconfig 直接解析失败。
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/kernelsu\//d' drivers/Makefile 2>/dev/null || true

          rm -rf drivers/kernelsu fs/kernelsu || true

          echo "=== 清理后校验 ==="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile 2>/dev/null || echo "  (已无残留引用)"

      - name: 生成基础配置并瘦身
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x scripts/config 2>/dev/null || true
          make ARCH=x86_64 ${{ inputs.defconfig }}
          # 目录已删，必须同时关掉开关，否则 make 会去编译不存在的 kernelsu/Makefile
          ./scripts/config --disable CONFIG_KSU || true
          ./scripts/config --disable CONFIG_KSU_DEBUG || true
          # 关键瘦身：关掉调试信息能省下数 GB，对 14GB 磁盘的托管 runner 是刚需
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_DEBUG_INFO_SPLIT
          # KPM 硬需求（SukiSU Ultra 官方要求非 GKI 设备必须开）
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL

          # 关闭 KVM：Bliss OS 是虚拟机里的 guest，用不到 KVM 宿主能力。
          # 实测若不关，modpost 会报 10 个 ERROR 并中断整个编译：
          #   "eventfd_ctx_put" [arch/x86/kvm/kvm.ko] undefined!
          #   "cpufreq_cpu_put" / "debugfs_*" ... 同理
          # 原因是 KVM 编为模块(=m)，但其依赖符号的提供者未编入 vmlinux。
          # 若确实需要 KVM：改为 --enable 并同时打开
          #   CONFIG_EVENTFD / CONFIG_CPU_FREQ / CONFIG_DEBUG_FS
          ./scripts/config --disable CONFIG_KVM || true
          ./scripts/config --disable CONFIG_KVM_INTEL || true
          ./scripts/config --disable CONFIG_KVM_AMD || true

          # 把 nomodeset 等参数固化进内核，省得每次开机手动按 e 追加。
          # 必须用 EXTEND（追加）而不是 OVERRIDE（覆盖）：OVERRIDE 会丢掉引导器传入的
          # androidboot.* / SRC= 等 Android-x86 关键参数，系统会直接起不来。
          if [ -n "${{ inputs.extra_cmdline }}" ]; then
            ./scripts/config --enable CONFIG_CMDLINE_BOOL
            ./scripts/config --set-str CONFIG_CMDLINE "${{ inputs.extra_cmdline }}"
            ./scripts/config --enable CONFIG_CMDLINE_EXTEND
            ./scripts/config --disable CONFIG_CMDLINE_OVERRIDE
            echo "内置启动参数: ${{ inputs.extra_cmdline }}"
          fi

          make ARCH=x86_64 olddefconfig
          echo "=== 配置生成结果 ==="
          grep -E "CONFIG_KSU=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_DEBUG_INFO=|CONFIG_CMDLINE" .config || true

      - name: 拉取 SukiSU Ultra 并集成
        run: |
          git clone --depth 1 -b "${{ inputs.sukisu_ref }}" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$SUKISU_DIR"
          ls "$SUKISU_DIR/kernel"
          test -f "$SUKISU_DIR/kernel/setup.sh" || { echo "::error::未找到 setup.sh"; exit 1; }

          cd "$KERNEL_DIR"
          # SukiSU Ultra 官方集成脚本（KernelSU 系通用做法）
          bash "$SUKISU_DIR/kernel/setup.sh" "${{ inputs.sukisu_ref }}" || {
            echo "::error::setup.sh 集成失败。非 GKI/x86 内核常见问题，需手工适配。"
            exit 1
          }

      - name: 校验并修复失效的 Kbuild 引用
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 - <<'PY'
          import re, os
          fixed = 0
          for f in ['drivers/Kconfig', 'drivers/Makefile', 'fs/Kconfig', 'fs/Makefile']:
              if not os.path.exists(f):
                  continue
              src = open(f, encoding='utf-8', errors='replace').read().splitlines()
              out = []
              for l in src:
                  m = re.search(r'^\s*source\s+"([^"]+)"', l)
                  if m and not os.path.exists(m.group(1)):
                      print('  移除失效 source: %s -> %s' % (f, m.group(1))); fixed += 1; continue
                  m2 = re.match(r'^\s*obj-\$\([^)]*\)\s*\+=\s*(\S+)', l)
                  if m2 and not os.path.exists(m2.group(1).rstrip('/')):
                      print('  移除失效 obj: %s -> %s' % (f, m2.group(1))); fixed += 1; continue
                  out.append(l)
              open(f, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('共修复 %d 处失效引用' % fixed)
          PY

          echo "=== SukiSU 源码实际落点 ==="
          ls -d drivers/kernelsu KernelSU drivers/*su* 2>/dev/null || echo "(drivers 下未发现)"

          # 若源码确实存在但 source 行缺失，补回去（setup.sh 有时会漏写）
          for d in drivers/kernelsu KernelSU; do
            if [ -f "$d/Kconfig" ] && ! grep -q "$d/Kconfig" drivers/Kconfig; then
              echo "source \"$d/Kconfig\"" >> drivers/Kconfig
              echo "  已补回 source: $d/Kconfig"
            fi
          done
          echo "=== CONFIG_KSU 是否有 Kconfig 定义 ==="
          grep -rn "^config KSU\b" --include=Kconfig . 2>/dev/null | head -5 \
            || echo "::warning::未找到 KSU 的 Kconfig 定义，后续 enable CONFIG_KSU 将无效"

      - name: 开启 KPM 与 SukiSU 相关配置
        if: ${{ inputs.enable_kpm }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KPM
          make ARCH=x86_64 olddefconfig
          echo "=== 校验关键配置 ==="
          grep -E "CONFIG_KSU=|CONFIG_KPM=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=" .config || true

      - name: 【可选/高风险】尝试合入 SUSFS
        if: ${{ inputs.enable_susfs }}
        continue-on-error: true
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "::warning::SUSFS 补丁面向 GKI 内核，非 GKI x86 大概率打不上，失败不影响后续步骤。"
          git clone --depth 1 "${{ inputs.susfs_repo }}" ../susfs || exit 1
          cd ../susfs && ls kernel_patches
          cd "$KERNEL_DIR"
          # 视补丁布局而定，这里给出最常见的两种尝试，失败即跳过
          for p in $(find ../susfs/kernel_patches -name '50_add_susfs_in_kernel*.patch'); do
            echo "尝试: $p"
            patch -p1 --forward --fuzz=3 < "$p" || echo "补丁 $p 失败，跳过"
          done
          ./scripts/config --enable CONFIG_KSU_SUSFS || true
          make olddefconfig || true

      - name: 编译内核
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # set -o pipefail 至关重要：让管道中任一命令失败即视为失败。
          # 若写成 `make ... | tail -60`，退出码会变成 tail 的 0，
          # 编译失败却显示"成功"，直到下一步才发现没有 bzImage。
          set -o pipefail
          echo "开始编译：$(date -u)  并发 $(nproc) 核"
          make ARCH=x86_64 -j$(nproc) --output-sync=target 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"
          echo "编译结束：$(date -u)"
        timeout-minutes: 300

      - name: 编译失败诊断
        if: failure()
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          [ -f "$LOG" ] || { echo "::warning::未生成 build.log"; exit 0; }
          echo "=== 典型错误行 ==="
          grep -nE "error:|Error [0-9]+|undefined reference|No such file|fatal error|Killed" "$LOG" \
            | head -60 || echo "(未匹配到典型错误关键词，请看下方日志尾部)"
          echo
          echo "=== 日志末尾 80 行 ==="
          tail -80 "$LOG"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: 收集产物
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          test -f arch/x86/boot/bzImage || { echo "::error::未生成 bzImage"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/out/kernel-$(make kernelversion)"
          make ARCH=x86_64 modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules"
          cd "$GITHUB_WORKSPACE/out"
          cp "$KERNEL_DIR/.config" ./config-used.txt
          tar czf modules.tar.gz -C modules .
          ls -lh
          du -sh .

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bliss-kernel-sukisu
          path: out/
          retention-days: 30

      - name: 发布到 Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Bliss Kernel + SukiSU Ultra (${{ inputs.kernel_branch }})
          body: |
            分支 `${{ inputs.kernel_branch }}` / defconfig `${{ inputs.defconfig }}`
            - SukiSU Ultra: `${{ inputs.sukisu_ref }}`
            - KPM: ${{ inputs.enable_kpm }}
            - SUSFS: ${{ inputs.enable_susfs }}（非 GKI 内核不保证成功）

            用法：`kernel` 替换 Bliss OS ISO 里的 `kernel` 文件，
            `modules.tar.gz` 解包后替换 `system.efs` 内 `/lib/modules/<版本>/`。
          files: out/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
