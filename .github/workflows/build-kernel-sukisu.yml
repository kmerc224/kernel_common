name: Build Bliss Kernel + SukiSU Ultra + KPM

# 编译 Bliss OS 内核：移除自带 KernelSU → 接入 SukiSU Ultra → 开 KPM →
# 把 Intel AX200（iwlwifi）的驱动连同固件一起编进内核本体，
# 使其不依赖 /lib/modules 与 /vendor/firmware 即可工作（裸机装机刚需）。
#
# 产物：bzImage + 内核模块 tarball → Artifacts / Releases。
#
# ── 踩过的坑，改配置时别踩回去 ──────────────────────────────
#  1. 必须分三步编：vmlinux → modules → bzImage。一次性 make 会让 modpost 早于
#     vmlinux 链接，符号表为空，任意模块引用基础符号都报 undefined!。
#  2. 判退出码用 ${PIPESTATUS[0]}，不能用 $?（管道里 $? 取的是 tee 的码，永远 0）。
#  3. 顶层 KernelSU/ 必须先删干净：setup.sh 是 `test -d KernelSU || git clone`，
#     残留旧目录会让 drivers/kernelsu 链接指向空 → "can't open file .../Kconfig"。
#  4. 删 KSU 引用要用精确 sed，不能用 /kernelsu/I d —— 会误删 depends on 等行，
#     破坏 Kconfig 语法，下一步 make defconfig 直接解析失败。
#  5. 别"修复" drivers/Makefile 里的失效 obj 引用：曾整片删掉 phy/ gpio/ usb/，
#     vmlinux 缺代码，modpost 报一片 undefined。
#  6. cmdline 必须用 EXTEND（追加）。OVERRIDE 会丢掉引导器传入的 androidboot.* /
#     SRC= 等 Android-x86 关键参数，系统直接起不来。
#  7. ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26；BlissOS 官方排除 24.04+
#     （装不上 libncurses5），必须钉死 ubuntu-22.04。
#  8. built-in 驱动在 rootfs 挂载前就 probe，此时读不到 /vendor/firmware，
#     所以 iwlwifi 内置化必须同时把 .ucode 用 CONFIG_EXTRA_FIRMWARE 编进 vmlinux。
# ────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'kernel_common 分支（16.9.7 → gloria-20240908 / 6.1.96）'
        required: true
        default: 'gloria-20240908'
      defconfig:
        description: 'defconfig'
        required: true
        default: 'android-x86_64_defconfig'
      sukisu_ref:
        description: 'SukiSU-Ultra 分支或 tag'
        required: true
        default: 'main'
      runner:
        description: 'runner 标签。想提速可填 ubuntu-22.04-8core / -16core（larger runner，需付费额度）'
        required: false
        default: 'ubuntu-22.04'
      use_ccache:
        description: '启用 ccache 并跨运行复用缓存（第二次起大幅提速，首次无收益）'
        type: boolean
        default: true
      slim_build:
        description: '【有风险】裁剪无关驱动（AMD/N卡/非Intel网卡/FireWire/InfiniBand/冷门文件系统）以缩短编译'
        type: boolean
        default: false
      extra_cmdline:
        description: '内置启动参数（追加，不覆盖引导器参数）。裸机装机留空；仅虚拟机排障时填 nomodeset'
        required: false
        default: ''
      ax200_builtin:
        description: 'Intel AX200 驱动+固件编进内核（裸机用；纯虚拟机可关）'
        type: boolean
        default: true
      enable_kpm:
        description: '开启 KPM（Kernel Patch Module）'
        type: boolean
        default: true
      enable_susfs:
        description: '【高风险】尝试合入 SUSFS，非 GKI 内核大概率失败'
        type: boolean
        default: false
      publish_release:
        description: '发布到 Releases'
        type: boolean
        default: false
      tag_name:
        description: 'Release 标签'
        required: false
        default: 'kernel-sukisu-autobuild'

permissions:
  contents: write

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  SUKISU_DIR: ${{ github.workspace }}/SukiSU-Ultra
  FW_DIR:     ${{ github.workspace }}/firmware
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350

    steps:
      - name: 依赖与磁盘自检
        run: |
          AVAIL=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          echo "可用 ${AVAIL:-0}GB / CPU $(nproc) 核"
          [ "${AVAIL:-0}" -lt 12 ] && { echo "::error::磁盘不足，请改 self-hosted runner"; exit 1; }
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git build-essential libssl-dev libelf-dev bc flex bison ccache \
            kmod dwarves zstd xz-utils rsync cpio python3 perl
          gcc --version | head -1

      - name: 拉取内核源码
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/android-generic/kernel_common.git "$KERNEL_DIR"
          cd "$KERNEL_DIR" && make kernelversion

      - name: 恢复 ccache 缓存
        if: ${{ inputs.use_ccache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # 主 key 带 run_id：每次保存一份新缓存；靠 restore-keys 命中最近一次
          key: ccache-${{ inputs.kernel_branch }}-${{ inputs.defconfig }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.kernel_branch }}-${{ inputs.defconfig }}-

      - name: 移除自带 KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig   2>/dev/null || true
          sed -i '/kernelsu\//d'        drivers/Makefile  2>/dev/null || true
          rm -rf drivers/kernelsu fs/kernelsu KernelSU
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile 2>/dev/null \
            || echo "已无 KSU 残留引用"

      - name: 生成基础配置并瘦身
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x scripts/config 2>/dev/null || true
          make ARCH=x86_64 ${{ inputs.defconfig }}

          # 目录已删，开关也要关，否则会去编不存在的 kernelsu/Makefile
          for s in CONFIG_KSU CONFIG_KSU_DEBUG; do
            ./scripts/config --disable "$s" || true
          done
          # 关调试信息省数 GB，14GB 磁盘的托管 runner 是刚需
          for s in CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_SPLIT; do
            ./scripts/config --disable "$s" || true
          done
          # SukiSU / KPM 硬需求
          ./scripts/config --enable CONFIG_KALLSYMS     || true
          ./scripts/config --enable CONFIG_KALLSYMS_ALL || true

          # 关 KVM：Bliss 是 guest 用不到；且 =m 时其依赖符号未进 vmlinux，
          # modpost 会报 10 个 ERROR 中断编译（实测先 kvm.ko，关掉后换 842/mhi）。
          for s in CONFIG_KVM CONFIG_KVM_INTEL CONFIG_KVM_AMD; do
            ./scripts/config --disable "$s" || true
          done

          # 驱动内置化：这些本来就在源码树里，defconfig 全设成了 =m，
          # 运行时没加载就表现为网卡不通 / 鼠标不动。改 =y 摆脱模块加载依赖。
          for s in CONFIG_HYPERVISOR_GUEST CONFIG_VMXNET3 CONFIG_VMWARE_VMCI \
                   CONFIG_VMWARE_BALLOON CONFIG_DRM_VMWGFX \
                   CONFIG_E1000 CONFIG_E1000E \
                   CONFIG_MOUSE_PS2 CONFIG_KEYBOARD_ATKBD CONFIG_INPUT_EVDEV \
                   CONFIG_HID_GENERIC CONFIG_USB_HID CONFIG_HID_MULTITOUCH; do
            ./scripts/config --enable "$s" || echo "::warning::$s 无此符号，跳过"
          done

          # 【可选】裁剪无关驱动，直接减少要编译的目标数（最实在的提速）
          # 风险自负：下面全是你这台机器用不到的东西，但别的机器可能需要。
          # 保留：Intel 网卡(E1000/E1000E)、Intel 无线(IWLWIFI)、VMware(VMXNET3/VMWGFX)、
          #       i915、HDA 声卡、USB、ext4/ntfs3/f2fs。
          if [ "${{ inputs.slim_build }}" = "true" ]; then
            for s in \
              CONFIG_DRM_RADEON CONFIG_DRM_AMDGPU CONFIG_DRM_NOUVEAU CONFIG_DRM_MGAG200 \
              CONFIG_DRM_AST CONFIG_DRM_GMA500 CONFIG_DRM_UDL \
              CONFIG_FIREWIRE CONFIG_FIREWIRE_OHCI CONFIG_FIREWIRE_SBP2 \
              CONFIG_INFINIBAND CONFIG_ISCSI_TCP CONFIG_SCSI_ISCSI_ATTRS CONFIG_SCSI_DEBUG \
              CONFIG_WLAN_VENDOR_ATH CONFIG_WLAN_VENDOR_ATMEL CONFIG_WLAN_VENDOR_BROADCOM \
              CONFIG_WLAN_VENDOR_CISCO CONFIG_WLAN_VENDOR_INTERSIL CONFIG_WLAN_VENDOR_MARVELL \
              CONFIG_WLAN_VENDOR_MEDIATEK CONFIG_WLAN_VENDOR_QUANTENNA CONFIG_WLAN_VENDOR_RALINK \
              CONFIG_WLAN_VENDOR_REALTEK CONFIG_WLAN_VENDOR_RSI CONFIG_WLAN_VENDOR_ST \
              CONFIG_WLAN_VENDOR_TI CONFIG_WLAN_VENDOR_ZYDAS CONFIG_WLAN_VENDOR_MICROCHIP \
              CONFIG_NET_VENDOR_3COM CONFIG_NET_VENDOR_AMD CONFIG_NET_VENDOR_AQUANTIA \
              CONFIG_NET_VENDOR_ATHEROS CONFIG_NET_VENDOR_BROCADE CONFIG_NET_VENDOR_CAVIUM \
              CONFIG_NET_VENDOR_CHELSIO CONFIG_NET_VENDOR_EMULEX CONFIG_NET_VENDOR_HISILICON \
              CONFIG_NET_VENDOR_MARVELL CONFIG_NET_VENDOR_MELLANOX CONFIG_NET_VENDOR_NVIDIA \
              CONFIG_NET_VENDOR_QLOGIC CONFIG_NET_VENDOR_SOLARFLARE CONFIG_NET_VENDOR_TEHUTI \
              CONFIG_NET_VENDOR_TI CONFIG_NET_VENDOR_VIA CONFIG_NET_VENDOR_XILINX \
              CONFIG_BTRFS_FS CONFIG_XFS_FS CONFIG_JFS_FS CONFIG_REISERFS_FS \
              CONFIG_GFS2_FS CONFIG_OCFS2_FS CONFIG_NILFS2_FS CONFIG_UFS_FS; do
              ./scripts/config --disable "$s" || true
            done
            echo "已裁剪无关驱动（slim_build）"
          fi

          # cmdline 只追加不覆盖（见坑 6）
          if [ -n "${{ inputs.extra_cmdline }}" ]; then
            ./scripts/config --enable  CONFIG_CMDLINE_BOOL
            ./scripts/config --set-str CONFIG_CMDLINE "${{ inputs.extra_cmdline }}"
            ./scripts/config --enable  CONFIG_CMDLINE_EXTEND
            ./scripts/config --disable CONFIG_CMDLINE_OVERRIDE
            echo "内置启动参数: ${{ inputs.extra_cmdline }}"
          fi

          make ARCH=x86_64 olddefconfig

      - name: Intel AX200 驱动 + 固件内置化
        if: ${{ inputs.ax200_builtin }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # ① 先开驱动。built-in 依赖链必须整条是 =y，否则 olddefconfig 会把它降级回 =m：
          #    IWLWIFI=y 需要 MAC80211=y，MAC80211=y 需要 CFG80211=y。
          for s in CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_IWLWIFI CONFIG_IWLMVM; do
            ./scripts/config --enable "$s" || echo "::warning::$s 无此符号，跳过"
          done
          ./scripts/config --disable CONFIG_IWLDVM || true   # 老 AGN 设备，AX200 用不到

          # ② 再抓固件（见坑 8）。
          #    blob:none + sparse 只取 cc-a0 系列，避免拉整个几百 MB 的 linux-firmware。
          rm -rf "$FW_DIR"
          git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/wkennington/linux-firmware.git "$FW_DIR" \
            || { rm -rf "$FW_DIR"
                 git clone --depth 1 --filter=blob:none --sparse \
                   https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git "$FW_DIR"
               } || echo "::warning::linux-firmware 克隆失败，跳过固件内置"
          if [ -d "$FW_DIR" ]; then
            ( cd "$FW_DIR" && git sparse-checkout init --no-cone \
                && git sparse-checkout set '/iwlwifi-cc-a0*' )
          fi
          echo "取到的固件："; ls -l "$FW_DIR" 2>/dev/null | grep iwlwifi || echo "  (空)"

          # 只取版本号最大的 3 个 ucode + 最新的 pnvm，别把一整套历史固件塞进内核
          FW_LIST=$(ls "$FW_DIR"/iwlwifi-cc-a0-*.ucode 2>/dev/null \
                    | xargs -n1 basename | sort -V -r | head -3 | tr '\n' ' ')
          PNVM=$(ls "$FW_DIR"/iwlwifi-cc-a0-*.pnvm 2>/dev/null \
                 | xargs -n1 basename | sort -V -r | head -1)
          FW_LIST=$(echo "$FW_LIST $PNVM" | xargs)   # 去掉首尾空格

          if [ -z "$FW_LIST" ]; then
            echo "::warning::未取到 AX200 固件，本次只内置驱动。"
            echo "::warning::运行时仍需 /vendor/firmware/iwlwifi-cc-a0-*.ucode，否则 Wi-Fi 起不来。"
          else
            echo "内置固件: $FW_LIST"
            ./scripts/config --set-str CONFIG_EXTRA_FIRMWARE_DIR "$FW_DIR"
            ./scripts/config --set-str CONFIG_EXTRA_FIRMWARE     "$FW_LIST"
            ./scripts/config --enable  CONFIG_FIRMWARE_IN_KERNEL
          fi

          make ARCH=x86_64 olddefconfig
          echo "=== AX200 相关最终取值 ==="
          grep -E '^CONFIG_(CFG80211|MAC80211|IWLWIFI|IWLMVM|IWLDVM|EXTRA_FIRMWARE|EXTRA_FIRMWARE_DIR|FIRMWARE_IN_KERNEL)=' .config \
            || echo "  (未取到，注意是否被降级为 =m)"

      - name: 集成 SukiSU Ultra
        run: |
          git clone --depth 1 -b "${{ inputs.sukisu_ref }}" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$SUKISU_DIR"
          test -f "$SUKISU_DIR/kernel/setup.sh" || { echo "::error::未找到 setup.sh"; exit 1; }
          cd "$KERNEL_DIR"
          bash "$SUKISU_DIR/kernel/setup.sh" "${{ inputs.sukisu_ref }}" \
            || { echo "::error::setup.sh 集成失败，非 GKI/x86 内核常见，需手工适配"; exit 1; }

      - name: 校验并补回 Kbuild 引用
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 只读体检（见坑 5：绝不自动删）
          grep -oP '^\s*source\s+"\K[^"]+' drivers/Kconfig 2>/dev/null | while read -r f; do
            [ -e "$f" ] || echo "::warning::失效 source: $f"
          done
          # setup.sh 偶尔漏写 source 行，补回去
          for d in drivers/kernelsu KernelSU; do
            if [ -f "$d/Kconfig" ] && ! grep -q "$d/Kconfig" drivers/Kconfig; then
              echo "source \"$d/Kconfig\"" >> drivers/Kconfig
              echo "  已补回 source: $d/Kconfig"
            fi
          done
          grep -rn "^config KSU\b" --include=Kconfig . 2>/dev/null | head -3 \
            || echo "::warning::未找到 config KSU 定义，后续 enable CONFIG_KSU 将无效"

      - name: 开启 KPM
        if: ${{ inputs.enable_kpm }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          grep -rn "^config KPM\b" --include=Kconfig . 2>/dev/null | head -3 \
            || echo "::warning::未找到 config KPM，setup.sh 可能没接上"
          ./scripts/config --enable CONFIG_KSU || echo "::warning::CONFIG_KSU 开启失败"
          ./scripts/config --enable CONFIG_KPM || echo "::warning::CONFIG_KPM 开启失败"

          # x86_64 上必开，否则编译期直接 #error：
          #   drivers/kernelsu/core/init.c: "missing the indirect syscall bypass patches!"
          # 原因：SukiSU 默认依赖 GKI 的 X86_FEATURE_INDIRECT_SAFE，Bliss 这类
          # 非 GKI x86 内核没有。开启后改用 patch syscall dispatcher 的钩子方式绕开。
          ./scripts/config --enable CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER \
            || echo "::warning::CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER 开启失败"

          # 回退保护：KSU/KPM 的 Kconfig 在 x86 上可能引入无法满足的依赖。
          # 失败就退回启用前的配置，保证至少能产出内核而不是整个流程停摆。
          cp .config .config.before-kpm
          make ARCH=x86_64 olddefconfig || {
            echo "::warning::开启 KSU/KPM 后 olddefconfig 失败，回退"
            cp .config.before-kpm .config
            echo "::warning::本次产出的内核不含 KPM"
          }
          grep -E "^CONFIG_(KSU|KPM|KALLSYMS|KALLSYMS_ALL)=" .config || true

      - name: 【可选/高风险】尝试合入 SUSFS
        if: ${{ inputs.enable_susfs }}
        continue-on-error: true
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "::warning::SUSFS 面向 GKI 内核，非 GKI x86 大概率打不上，失败不影响后续。"
          git clone --depth 1 https://github.com/sidex15/susfs4ksu.git ../susfs || exit 1
          for p in $(find ../susfs/kernel_patches -name '50_add_susfs_in_kernel*.patch'); do
            patch -p1 --forward --fuzz=3 < "$p" || echo "补丁 $p 失败，跳过"
          done
          ./scripts/config --enable CONFIG_KSU_SUSFS || true
          make ARCH=x86_64 olddefconfig || true

      - name: 编译内核
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # ccache：把 /usr/lib/ccache 前置到 PATH，make 里的 gcc 就自动走 ccache。
          # 关掉 CONFIG_DEBUG_INFO 后产物不含绝对路径，跨目录命中率很高。
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            export CCACHE_MAXSIZE=2G
            ccache -M 2G
            ccache -z            # 清零统计，方便看本次命中率
            echo "ccache: $(command -v gcc) -> $(readlink -f "$(command -v gcc)")"
          fi
          # 并发：内核编译 I/O 与 CPU 混合，2 倍核数通常更快；上限 12 防内存爆
          J=$(( $(nproc) * 2 )); [ "$J" -gt 12 ] && J=12
          echo "开始编译：$(date -u)  $(nproc) 核 / -j$J / ccache=${{ inputs.use_ccache }}"

          set +e   # 手动接管错误码，保证日志合并一定执行得到（见坑 2）
          T0=$(date +%s)
          make ARCH=x86_64 -j"$J" vmlinux 2>&1 | tee "$GITHUB_WORKSPACE/build-vmlinux.log"; RC1=${PIPESTATUS[0]}
          T1=$(date +%s); echo ">> vmlinux 阶段耗时 $(( T1 - T0 ))s"
          make ARCH=x86_64 -j"$J" modules 2>&1 | tee "$GITHUB_WORKSPACE/build-modules.log"; RC2=${PIPESTATUS[0]}
          T2=$(date +%s); echo ">> modules 阶段耗时 $(( T2 - T1 ))s"
          make ARCH=x86_64 -j"$J" bzImage 2>&1 | tee "$GITHUB_WORKSPACE/build-bzimage.log"; RC3=${PIPESTATUS[0]}
          echo ">> bzImage 阶段耗时 $(( $(date +%s) - T2 ))s / 总计 $(( $(date +%s) - T0 ))s"

          cat "$GITHUB_WORKSPACE"/build-vmlinux.log \
              "$GITHUB_WORKSPACE"/build-modules.log \
              "$GITHUB_WORKSPACE"/build-bzimage.log > "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
          echo "退出码 vmlinux=$RC1 modules=$RC2 bzImage=$RC3"
          [ "${{ inputs.use_ccache }}" = "true" ] && ccache -s
          ls -lh vmlinux arch/x86/boot/bzImage 2>&1 || true
          if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ] || [ "$RC3" -ne 0 ]; then
            echo "::error::编译失败（见坑 1：必须 vmlinux → modules → bzImage 三步）"
            exit 1
          fi
          echo "编译完成：$(date -u)"
        timeout-minutes: 300

      - name: 编译失败诊断
        if: failure()
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          ls -l .config include/config/auto.conf 2>&1 | head -3
          LOG="$GITHUB_WORKSPACE/build.log"
          [ -f "$LOG" ] || { echo "::warning::无 build.log"; exit 0; }
          echo "=== 典型错误行 ==="
          grep -nE "error:|Error [0-9]+|undefined reference|No such file|fatal error|Killed" "$LOG" | head -40
          echo "=== 日志末尾 120 行 ==="
          tail -120 "$LOG"

      # 用 always()：编译失败时缓存里的部分结果下次一样能用
      - name: 保存 ccache 缓存
        if: ${{ always() && inputs.use_ccache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.kernel_branch }}-${{ inputs.defconfig }}-${{ github.run_id }}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: 收集产物
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          test -f arch/x86/boot/bzImage || { echo "::error::未生成 bzImage"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 用 kernelrelease 而不是 kernelversion：前者带 -gloria-xanmod1 之类的
          # localversion 后缀，跟 /lib/modules/ 下的目录名一致，排查版本错配对得上。
          KREL=$(make -s kernelrelease)
          echo "内核版本: $KREL"
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/out/kernel-$KREL"

          # vmlinux：未压缩 ELF + 符号表，gdb 定位 oops 用。
          # 注意 CONFIG_DEBUG_INFO 已关，不含 DWARF，只有符号没有源码行号。
          # 约 40MB，压完 ~10MB。
          # 用 if 而不是 `[ -f x ] && cmd`：GitHub 的 run 默认带 -e，
          # 短路返回非 0 会让整个步骤直接失败。
          if [ -f vmlinux ]; then
            xz -T0 -1 -c vmlinux > "$GITHUB_WORKSPACE/out/vmlinux-$KREL.xz"
          else
            echo "::warning::未找到 vmlinux，跳过"
          fi
          # System.map：纯文本符号地址表，比 vmlinux 轻得多，查 panic 基本够用
          if [ -f System.map ]; then
            cp System.map "$GITHUB_WORKSPACE/out/System.map-$KREL"
          fi

          # INSTALL_MOD_STRIP=1：去掉模块符号表，产物体积减半（不影响加载）
          make ARCH=x86_64 modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules" \
               INSTALL_MOD_STRIP=1
          cp "$KERNEL_DIR/.config" "$GITHUB_WORKSPACE/out/config-used.txt"
          cd "$GITHUB_WORKSPACE/out" && tar czf modules.tar.gz -C modules . && rm -rf modules
          ls -lh

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bliss-kernel-sukisu
          path: out/
          retention-days: 30

      - name: 发布到 Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Bliss Kernel + SukiSU Ultra (${{ inputs.kernel_branch }})
          body: |
            分支 `${{ inputs.kernel_branch }}` / defconfig `${{ inputs.defconfig }}`
            - SukiSU Ultra: `${{ inputs.sukisu_ref }}`
            - KPM: ${{ inputs.enable_kpm }} / SUSFS: ${{ inputs.enable_susfs }}（非 GKI 不保证成功）
            - Intel AX200(iwlwifi) 内置: ${{ inputs.ax200_builtin }}
            - 内置启动参数: `${{ inputs.extra_cmdline }}`（空表示未写入）

            用法：`kernel-*` 替换 Bliss OS ISO 根目录的 `kernel`；
            `modules.tar.gz` 解包后替换 `system.efs` 内 `/lib/modules/<版本>/`。
            若开启了 AX200 内置，固件已编进 vmlinux，无需再往 /vendor/firmware 放 .ucode。
          files: out/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
