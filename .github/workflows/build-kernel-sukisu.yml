name: Build Bliss Kernel + SukiSU Ultra + KPM

# 编译 Bliss OS 内核，移除内核自带 KernelSU，接入 SukiSU Ultra，开启 KPM，可选 SUSFS。
#
# ⚠️ 已知风险（写在最前面，别跳过）：
#   1. SukiSU Ultra 官方声明 X86_64 仅 "some" 支持 —— x86_64 不是它的主战场，arm64 才是。
#   2. Bliss 的 kernel_common 是 **非 GKI** 内核。SUSFS 补丁主要面向 GKI(android12-5.10/13-5.15/14-6.1)，
#      对非 GKI x86 内核极可能打不上或需手工修 patch。故 SUSFS 默认关闭，开启属自选风险。
#   3. GitHub 托管 runner 磁盘约 14GB，内核编译连产物通常 10–20GB。
#      本 workflow 已禁用 DEBUG_INFO 大幅瘦身；若仍爆盘，请改用 self-hosted runner。
#
# 产物：bzImage 内核 + 内核模块 tarball，发布到 Releases / Actions Artifacts。

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'kernel_common 分支（16.9.7 对应 gloria-20240908 / 6.1.96）'
        required: true
        default: 'gloria-20240908'
      defconfig:
        description: 'defconfig'
        required: true
        default: 'android-x86_64_defconfig'
      sukisu_ref:
        description: 'SukiSU-Ultra 分支或 tag'
        required: true
        default: 'main'
      enable_kpm:
        description: '开启 KPM（Kernel Patch Module）'
        type: boolean
        default: true
      enable_susfs:
        description: '【高风险】尝试合入 SUSFS 补丁，非 GKI 内核大概率失败'
        type: boolean
        default: false
      susfs_repo:
        description: 'SUSFS 补丁仓库'
        required: false
        default: 'https://github.com/sidex15/susfs4ksu'
      publish_release:
        description: '发布到 Releases'
        type: boolean
        default: false
      tag_name:
        description: 'Release 标签'
        required: false
        default: 'kernel-sukisu-autobuild'

permissions:
  contents: write

jobs:
  build:
    # 内核编译比整棵 AOSP 轻得多，托管 runner 值得一试；爆盘则改 self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      SUKISU_DIR: ${{ github.workspace }}/SukiSU-Ultra

    steps:
      - name: 磁盘与资源自检
        run: |
          df -h "$GITHUB_WORKSPACE"
          AVAIL=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          echo "可用空间 ${AVAIL}GB；CPU $(nproc) 核"
          if [ "${AVAIL:-0}" -lt 12 ]; then
            echo "::error::可用空间 ${AVAIL}GB 过少，内核编译大概率失败。请改用 self-hosted runner。"
            exit 1
          fi

      - name: 安装内核编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git build-essential libssl-dev libelf-dev bc flex bison ccache \
            kmod dwarves zstd xz-utils rsync cpio python3
          gcc --version | head -1

      - name: 拉取内核源码（浅克隆）
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/android-generic/kernel_common.git "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          # 打印版本，确认拉对了分支
          make kernelversion

      - name: 移除内核自带 KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "=== 查找自带 KSU 痕迹 ==="
          grep -rn "kernelsu\|KernelSU\|CONFIG_KSU" --include=Kconfig --include=Makefile \
            drivers/ fs/ 2>/dev/null | head -20 || echo "(Kconfig/Makefile 未发现)"
          ls -d drivers/kernelsu fs/kernelsu 2>/dev/null || echo "(无 kernelsu 目录)"

          echo "=== 禁用配置项 ==="
          ./scripts/config --file arch/x86/configs/${{ inputs.defconfig }} --disable CONFIG_KSU || true
          ./scripts/config --file arch/x86/configs/${{ inputs.defconfig }} --disable CONFIG_KSU_DEBUG || true

          echo "=== 删除 KSU 源码目录（若存在）==="
          rm -rf drivers/kernelsu fs/kernelsu || true

          echo "=== 清理 Kconfig / Makefile 中的引用 ==="
          grep -rl "kernelsu" drivers/*/Kconfig drivers/*/Makefile fs/*/Kconfig 2>/dev/null | while read -r f; do
            echo "  清理: $f"
            sed -i '/kernelsu/I d' "$f"
          done

      - name: 生成基础配置并瘦身
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make ${{ inputs.defconfig }}
          # 关键瘦身：关掉调试信息能省下数 GB，对 14GB 磁盘的托管 runner 是刚需
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_DEBUG_INFO_SPLIT
          # KPM 硬需求（SukiSU Ultra 官方要求非 GKI 设备必须开）
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          make olddefconfig

      - name: 拉取 SukiSU Ultra 并集成
        run: |
          git clone --depth 1 -b "${{ inputs.sukisu_ref }}" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$SUKISU_DIR"
          ls "$SUKISU_DIR/kernel"
          test -f "$SUKISU_DIR/kernel/setup.sh" || { echo "::error::未找到 setup.sh"; exit 1; }

          cd "$KERNEL_DIR"
          # SukiSU Ultra 官方集成脚本（KernelSU 系通用做法）
          bash "$SUKISU_DIR/kernel/setup.sh" "${{ inputs.sukisu_ref }}" || {
            echo "::error::setup.sh 集成失败。非 GKI/x86 内核常见问题，需手工适配。"
            exit 1
          }

      - name: 开启 KPM 与 SukiSU 相关配置
        if: ${{ inputs.enable_kpm }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KPM
          make olddefconfig
          echo "=== 校验关键配置 ==="
          grep -E "CONFIG_KSU=|CONFIG_KPM=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=" .config || true

      - name: 【可选/高风险】尝试合入 SUSFS
        if: ${{ inputs.enable_susfs }}
        continue-on-error: true
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "::warning::SUSFS 补丁面向 GKI 内核，非 GKI x86 大概率打不上，失败不影响后续步骤。"
          git clone --depth 1 "${{ inputs.susfs_repo }}" ../susfs || exit 1
          cd ../susfs && ls kernel_patches
          cd "$KERNEL_DIR"
          # 视补丁布局而定，这里给出最常见的两种尝试，失败即跳过
          for p in $(find ../susfs/kernel_patches -name '50_add_susfs_in_kernel*.patch'); do
            echo "尝试: $p"
            patch -p1 --forward --fuzz=3 < "$p" || echo "补丁 $p 失败，跳过"
          done
          ./scripts/config --enable CONFIG_KSU_SUSFS || true
          make olddefconfig || true

      - name: 编译内核
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j$(nproc) 2>&1 | tail -40
        timeout-minutes: 300

      - name: 收集产物
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          test -f arch/x86/boot/bzImage || { echo "::error::未生成 bzImage"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/out/kernel-$(make kernelversion)"
          make modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules"
          cd "$GITHUB_WORKSPACE/out"
          cp "$KERNEL_DIR/.config" ./config-used.txt
          tar czf modules.tar.gz -C modules .
          ls -lh
          du -sh .

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bliss-kernel-sukisu
          path: out/
          retention-days: 30

      - name: 发布到 Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Bliss Kernel + SukiSU Ultra (${{ inputs.kernel_branch }})
          body: |
            分支 `${{ inputs.kernel_branch }}` / defconfig `${{ inputs.defconfig }}`
            - SukiSU Ultra: `${{ inputs.sukisu_ref }}`
            - KPM: ${{ inputs.enable_kpm }}
            - SUSFS: ${{ inputs.enable_susfs }}（非 GKI 内核不保证成功）

            用法：`kernel` 替换 Bliss OS ISO 里的 `kernel` 文件，
            `modules.tar.gz` 解包后替换 `system.efs` 内 `/lib/modules/<版本>/`。
          files: out/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
